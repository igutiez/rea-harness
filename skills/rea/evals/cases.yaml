should_trigger:
  - prompt: "This Electron app checks the license offline; figure out how the check works from the shipped binary."
    why: "The claim needs the shipped artifact, not the source repository."
  - prompt: "Compare what this v2 APK sends over the wire with what v1 sent."
    why: "Android package plus runtime behavior, delegated to REA."
  - prompt: "The release build behaves differently from our checkout. Reconstruct the feature from the ASAR."
    why: "Bundled JavaScript evidence that source alone cannot establish."
  - prompt: "Decompile this firmware image and map the update handler."
    why: "Firmware/artifact analysis is a REA route."
  - prompt: "Audit this vendor's macOS app for where it stores the session token."
    why: "Passive/runtime artifact analysis within an authorized target."
should_not_trigger:
  - prompt: "Review the architecture of this TypeScript monorepo."
    route_to: "codebase-onboarding"
    why: "A complete source repository is ordinary repository analysis, not REA."
  - prompt: "Fix the failing unit test in the payments module."
    route_to: "debug"
    why: "Source-level debugging needs no artifact evidence."
  - prompt: "Write a landing page for the new pricing tier."
    route_to: "landing-copy"
    why: "No shipped artifact or runtime behavior is involved."
  - prompt: "Set up CI for the Go service."
    route_to: "github-actions"
    why: "Build configuration, not reverse engineering."
capability:
  - scenario: "A user supplies an authorized desktop app and asks how a feature decides to enable itself."
    must_include:
      - "Record the target identity and authorization in 02-DOCS/wiki/rea/"
      - "Distinguish observations, inferences and unknowns with Evidence IDs"
      - "Skip REA for ordinary source-repository review"
